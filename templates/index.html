<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetPal - Pet Animals Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #fdf4e7;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      height: 92vh;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #f28c28;
      color: #ffffff;
      padding: 16px 20px;
    }

    .chat-header h1 { font-size: 20px; }
    .chat-header p { font-size: 13px; opacity: 0.9; margin-top: 2px; }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fffaf3;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #f28c28;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: #ffffff;
      color: #333333;
      border: 1px solid #f0e2cc;
      border-bottom-left-radius: 4px;
    }

    .message.typing { color: #999999; font-style: italic; }

    .chat-input {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid #f0e2cc;
      background: #ffffff;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #e3d3b8;
      border-radius: 24px;
      font-size: 15px;
      outline: none;
    }

    .chat-input input:focus { border-color: #f28c28; }

    .chat-input button {
      padding: 0 22px;
      background: #f28c28;
      color: #ffffff;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      cursor: pointer;
    }

    .chat-input button:hover { background: #d97a1c; }
    .chat-input button:disabled { background: #cccccc; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>🐾 PetPal</h1>
      <p>Ask me anything about pet animals</p>
    </div>

    <div class="chat-messages" id="messages">
      <div class="message bot">Hi! I'm PetPal. Ask me anything about caring for your pets.</div>
    </div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type your question about pets..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const history = [];

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function formatText(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/^\s*[*-]\s+/gm, "• ")
        .replace(/\n/g, "<br>");
    }

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = "message " + role;
      div.innerHTML = role === "bot" ? formatText(text) : escapeHtml(text);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const message = inputEl.value.trim();
      if (!message) return;

      addMessage(message, "user");
      inputEl.value = "";
      sendBtn.disabled = true;

      const typingEl = addMessage("Typing...", "bot typing");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await response.json();
        typingEl.remove();

        if (response.ok) {
          addMessage(data.reply, "bot");
          history.push({ role: "user", text: message });
          history.push({ role: "bot", text: data.reply });
        } else {
          addMessage(data.error || "Something went wrong.", "bot");
        }
      } catch (error) {
        typingEl.remove();
        addMessage("Unable to reach the server. Please try again.", "bot");
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
